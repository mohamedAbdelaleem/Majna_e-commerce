version: "3.8"
services:
  majna-db:
    container_name: majna-postgres-db
    image: postgres:15.3-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  majna-app:
    container_name: majna-django-app
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./src:/usr/src/app
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      - majna-db

  redis-broker:
    container_name: majna-redis-broker
    image: redis:7.0-alpine

  celery-worker:
    container_name: majna-celery-worker
    build:
      context: .
      dockerfile: docker/celery/Dockerfile
    entrypoint: ["celery", "-A", "majna.celery", "worker", "--loglevel=info"]
    volumes:
      - ./src:/usr/src/app
    env_file:
      - .env
    depends_on:
      - majna-db
      - redis-broker

  celery-beat:
    container_name: majna-celery-beat
    build:
      context: .
      dockerfile: docker/celery/Dockerfile
    entrypoint: ["celery", "-A", "majna.celery", "beat", "--loglevel=info"]
    volumes:
      - ./src:/usr/src/app
    env_file:
      - .env
    depends_on:
      - majna-db
      - redis-broker
volumes:
  postgres_data:
